<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="note・Xで紹介した記事の詳細ページをまとめたポータル。">
  <meta name="theme-color" content="#102a2a">
  <title>Affiliate Pages — 記事ポータル</title>
  <style>
    :root {
      --ink: #15201f;
      --paper: #f4f0e7;
      --paper-2: #ebe4d6;
      --forest: #102a2a;
      --forest-2: #173d39;
      --orange: #e36c38;
      --orange-soft: #f3b28d;
      --teal: #4fa99a;
      --line: rgba(21, 32, 31, .17);
      --muted: #66716e;
      --white: #fffdf8;
      --shadow: 0 18px 55px rgba(21, 32, 31, .12);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 4%, rgba(227, 108, 56, .12), transparent 22rem),
        var(--paper);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
      line-height: 1.7;
    }

    a { color: inherit; }
    .shell { width: min(1160px, calc(100% - 40px)); margin-inline: auto; }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-block: 28px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      font-weight: 800;
      letter-spacing: .08em;
      font-size: .88rem;
    }
    .brand-mark {
      width: 36px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 1px solid currentColor;
      border-radius: 50%;
      font-family: Georgia, serif;
      font-size: 1.05rem;
    }

    .hero {
      padding-block: 40px 60px;
    }
    .hero h1 {
      font-size: clamp(1.8rem, 3.4vw, 2.6rem);
      margin: 0 0 14px;
      letter-spacing: .02em;
    }
    .hero p {
      max-width: 46rem;
      color: var(--muted);
      margin: 0;
    }

    .articles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding-block: 20px 80px;
    }
    .card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      text-decoration: none;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform .15s ease;
    }
    .card:hover { transform: translateY(-3px); }
    .card .tag {
      font-size: .72rem;
      letter-spacing: .08em;
      color: var(--orange);
      font-weight: 700;
    }
    .card h2 {
      font-size: 1.05rem;
      margin: 0;
    }
    .card p {
      margin: 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .empty {
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
    }

    footer {
      padding-block: 30px 50px;
      color: var(--muted);
      font-size: .82rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="./">
        <span class="brand-mark">A</span>
        AFFILIATE PAGES
      </a>
    </header>

    <section class="hero">
      <h1>記事ポータル</h1>
      <p>note・Xで紹介した内容の詳細版をまとめています。各カードから記事へ移動できます。</p>
    </section>

    <section class="articles">
      <a class="card" href="./202607_suitcase-rental/">
        <span class="tag">SUITCASE</span>
        <h2>スーツケースを買わずに借りている理由</h2>
        <p>サムソナイトの実売価格とレンタル料金から損益分岐を計算し、保管コストまで含めて買うか借りるかを整理する。</p>
      </a>
    </section>

    <footer>&copy; 2026</footer>
  </div>
</body>
</html>
